# ── 摄像头（每个路口 2 路，主干方向 + 人行过街） ────────
camera_defaults:
  per_intersection: 2
  stream_url_pattern: "rtsp://sim.yscity.gov.cn/{camera_id}/main"
  ptz_presets: ["全景", "进口道特写", "人行横道"]

# ── 演示事件脚本（种子化生成，保证演示可复现） ────────
incident_script:
  daily_seed: "ys-city"
  # 每日事件规模基线（种子化浮动 ±20%）
  baseline:
    critical: 1    # 重大（涉及多车/占双车道）
    major: 3       # 较大（占一条车道）
    minor: 5       # 一般（路肩/抛锚）
    construction: 1  # 施工区
  types: ["追尾事故", "刮擦事故", "车辆抛锚", "货物洒落", "道路施工", "临时管制"]
