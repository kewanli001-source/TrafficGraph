  次干道:
    peak:    {cycle_s: 120, phases: [{name: "东西直行", green_s: 36, yellow_s: 3, min_green_s: 15}, {name: "东西左转", green_s: 16, yellow_s: 3, min_green_s: 15}, {name: "南北直行", green_s: 36, yellow_s: 3, min_green_s: 15}, {name: "南北左转", green_s: 14, yellow_s: 3, min_green_s: 15}]}
    offpeak: {cycle_s: 95,  phases: [{name: "东西直行", green_s: 30, yellow_s: 3, min_green_s: 15}, {name: "东西左转", green_s: 13, yellow_s: 3, min_green_s: 15}, {name: "南北直行", green_s: 30, yellow_s: 3, min_green_s: 15}, {name: "南北左转", green_s: 11, yellow_s: 3, min_green_s: 15}]}
