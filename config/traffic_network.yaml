# 上海市路网模型 — TrafficSim 仿真配置
# 版本: v1.0
# 用途: 交通指挥 Agent 的仿真数据源（TRAFFIC_BACKEND=sim，默认）
# 维护规则: 路网/信号方案变更后同步更新此文件与 routes.yaml

city:
  name: "上海市"
  timezone: "Asia/Shanghai"
  population_wan: 320
  vehicle_count_wan: 96

# ── 辖区 ──────────────────────────────────────────────
districts:
  - id: DIST-CBD
    name: "中心商务区"
  - id: DIST-OLD
    name: "老城区"
  - id: DIST-HT
    name: "高新区"
  - id: DIST-PORT
    name: "港区"

# ── 干线走廊 ──────────────────────────────────────────
corridors:
  - id: COR-SJ
    name: "世纪大道"
    road_class: "主干道"
    length_km: 6.2
    design_speed_kmh: 50
    direction: "东西"
  - id: COR-JF
    name: "解放路"
    road_class: "主干道"
    length_km: 4.8
    design_speed_kmh: 50
    direction: "南北"
  - id: COR-BJ
    name: "滨江快速路"
    road_class: "快速路"
    length_km: 8.5
    design_speed_kmh: 80
    direction: "东西"
  - id: COR-XF
    name: "学府大街"
    road_class: "次干道"
    length_km: 3.6
    design_speed_kmh: 40
    direction: "东西"
  - id: COR-HC
    name: "环城路"
    road_class: "主干道"
    length_km: 12.0
    design_speed_kmh: 60
    direction: "环形"

# ── 信号方案默认模板（按道路等级） ─────────────────────
# green_s 之和 + 黄灯 ≈ cycle_s；min_green_s 为 GB 14886 行人过街下限
signal_defaults:
  主干道:
    peak:    {cycle_s: 140, phases: [{name: "东西直行", green_s: 48, yellow_s: 3, min_green_s: 15}, {name: "东西左转", green_s: 22, yellow_s: 3, min_green_s: 15}, {name: "南北直行", green_s: 42, yellow_s: 3, min_green_s: 15}, {name: "南北左转", green_s: 18, yellow_s: 3, min_green_s: 15}]}
    offpeak: {cycle_s: 110, phases: [{name: "东西直行", green_s: 38, yellow_s: 3, min_green_s: 15}, {name: "东西左转", green_s: 18, yellow_s: 3, min_green_s: 15}, {name: "南北直行", green_s: 33, yellow_s: 3, min_green_s: 15}, {name: "南北左转", green_s: 14, yellow_s: 3, min_green_s: 15}]}
