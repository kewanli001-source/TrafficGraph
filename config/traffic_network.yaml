    peak:    {cycle_s: 150, phases: [{name: "东西直行", green_s: 62, yellow_s: 3, min_green_s: 20}, {name: "东西左转", green_s: 20, yellow_s: 3, min_green_s: 15}, {name: "南北直行", green_s: 45, yellow_s: 3, min_green_s: 15}, {name: "南北左转", green_s: 14, yellow_s: 3, min_green_s: 15}]}
    offpeak: {cycle_s: 120, phases: [{name: "东西直行", green_s: 55, yellow_s: 3, min_green_s: 20}, {name: "东西左转", green_s: 16, yellow_s: 3, min_green_s: 15}, {name: "南北直行", green_s: 32, yellow_s: 3, min_green_s: 15}, {name: "南北左转", green_s: 11, yellow_s: 3, min_green_s: 15}]}
